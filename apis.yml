name: Claimglide
description: >-
  Claimglide (ClaimGlide) is an AI-powered software platform that automates the
  end-to-end prior-authorization process for private medical practices and
  healthcare providers. It generates prior-auth submissions using payer-approved
  language, auto-pulls clinical data from EMR systems, follows up with payers,
  tracks authorization timelines, and auto-generates appeal letters to increase
  the share of prior-auths approved and shorten turnaround time. Claimglide
  integrates with major EMR/EHR platforms including eClinicalWorks, athenahealth,
  NextGen Healthcare, and ModMed, and states HIPAA compliance. Founded in 2025 in
  Seattle by Nami Lindquist and backed by Y Combinator (Winter 2026 batch), the
  company was added to the API Evangelist network as a portfolio lead. No public
  API, developer documentation, or developer portal is published at this time.
